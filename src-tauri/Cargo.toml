[package]
name = "lanshare"
version = "0.1.0"
description = "局域网文件与文本互传"
authors = ["高鹏"]
license = "MIT"
edition = "2021"
# 1.88 是 image 0.25 的最低要求（缩略图生成用）；低于此版本无法构建
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
get_if_addrs = "0.1"
ip = "1"
qrcode = { version = "0.12", features = ["svg"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
percent-encoding = "2"
# 缩略图生成：只开需要的解码器（jpeg/png/gif/webp/bmp），
# 关掉 tiff/exr/avif 等冷门格式以控制产物体积与编译时间。
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
dirs = "5"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
rfd = { version = "0.14", features = ["tokio"] }
# 用 socket2 手动建监听套接字以设置 SO_REUSEADDR：
# 重启时旧连接处于 TIME_WAIT，若不设该选项，新进程会因端口「被占用」而回退到随机端口，
# 导致刚重启就又被判定成「端口已修改」。
socket2 = "0.5"

[features]
# Default to nothing; Tauri enables what it needs.
default = []
