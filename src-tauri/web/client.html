<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>LanShare · 传文件</title>
    <style>
      :root {
        --accent: #4f46e5;
        --accent-soft: rgba(79, 70, 229, 0.1);
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1f2430;
        --muted: #6b7280;
        --border: #e6e8ec;
        --radius: 12px;
        --shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #6f67f0;
          --accent-soft: rgba(111, 103, 240, 0.14);
          --bg: #0f1115;
          --panel: #171a21;
          --text: #e6e9ef;
          --muted: #9aa3b2;
          --border: #262b36;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .app { max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }
      .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; }
      .brand h1 { font-size: 16px; font-weight: 600; margin: 0; }
      .brand p { margin: 0; font-size: 12px; color: var(--muted); }
      .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #c2c7d0; }
      .dot.on { background: #22c55e; }
      .dot.off { background: #ef4444; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
      .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .muted { color: var(--muted); }
      button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 8px 14px; transition: .15s; }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 4px 8px; }
      button.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; color: var(--muted); }
      button.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
      input[type="text"], input[type="password"], input[type="file"] { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; width: 100%; }
      input:focus { outline: none; border-color: var(--accent); }
      .list { display: flex; flex-direction: column; gap: 8px; }
      .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
      .item .meta { flex: 1 1 auto; min-width: 0; }
      .item .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item .sub { font-size: 12px; color: var(--muted); }
      .item .acts { display: flex; gap: 6px; flex-shrink: 0; }
      /* 文件行缩略图：图片走服务端 320px 缩略图，其余显示扩展名徽章 */
      .item .thumb { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 8px; overflow: hidden; background: var(--accent-soft); display: grid; place-items: center; }
      .item .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .item .thumb .ext { font-size: 10px; font-weight: 700; letter-spacing: .3px; color: var(--accent); }
      textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 92px; resize: vertical; }
      textarea:focus { outline: none; border-color: var(--accent); }
      .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
      .banner { padding: 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 13px; margin-bottom: 12px; }
      .banner.err { background: rgba(239,68,68,.1); color: #ef4444; }
      hr.sep { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
      .hidden { display: none; }
      .pwd-input { letter-spacing: 4px; font-size: 18px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="brand">
          <div class="logo">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m8 7 4-4 4 4"/></svg>
          </div>
          <div>
            <h1>LanShare</h1>
            <p>向这台电脑传文件 / 文本</p>
          </div>
        </div>
        <div class="status">
          <span id="dot" class="dot"></span>
          <span id="stext">未连接</span>
        </div>
      </div>

      <!-- 连接卡片 -->
      <div id="connect-card" class="card">
        <h2>连接这台电脑</h2>
        <div class="muted" style="margin-bottom: 10px">请输入电脑上显示的连接密码。</div>
        <input id="pwd" class="pwd-input" type="password" inputmode="numeric" maxlength="6" placeholder="6 位连接密码" />
        <div style="margin-top: 10px">
          <input id="name" type="text" placeholder="设备名（如：我的手机）" />
        </div>
        <div class="row" style="margin-top: 12px; justify-content: flex-end">
          <button id="connect" class="primary">连接</button>
        </div>
        <div id="conn-msg" class="banner err hidden" style="margin-top: 10px"></div>
      </div>

      <!-- 扫码免密：自动连接中（连接失败时回到上面的连接卡片） -->
      <div id="auto-card" class="card hidden">
        <h2>正在连接…</h2>
        <div class="muted" id="auto-text">通过扫码免密连接中，请稍候。</div>
        <div id="auto-msg" class="banner err hidden" style="margin-top: 10px"></div>
        <div class="row hidden" id="auto-fallback" style="margin-top: 12px; justify-content: flex-end">
          <button id="auto-manual" class="primary">手动输入密码</button>
        </div>
      </div>

      <!-- 已连接区域 -->
      <div id="main-area" class="hidden">
        <div class="banner">已连接。可发送文件 / 文本，或下载电脑分享的文件。</div>

        <div class="card">
          <h2>发送文件到电脑</h2>
          <div class="row between" style="align-items: center">
            <div class="muted">选择文件后自动上传</div>
            <button id="upload" class="icon-btn" title="选择文件并上传" aria-label="选择文件并上传">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg>
            </button>
            <input id="file" type="file" multiple hidden />
          </div>
          <div id="up-msg" class="muted" style="margin-top: 8px"></div>
        </div>

        <div class="card">
          <h2>可下载文件</h2>
          <div id="files" class="list"><div class="empty">暂无文件</div></div>
        </div>

        <div class="card">
          <h2>文本同步</h2>
          <div class="muted" style="margin-bottom: 6px">多设备共享文本框，终端编辑实时互通。</div>
          <textarea id="shared" placeholder="在此输入，所有设备实时同步…"></textarea>
          <div class="row" style="margin-top: 8px; justify-content: space-between; align-items: center;">
            <span class="muted" id="hint"></span>
            <div class="row" style="gap: 6px">
              <button id="clear" class="icon-btn" title="清空" aria-label="清空">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
              <button id="copy" class="icon-btn" title="复制" aria-label="复制">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="row" style="justify-content: flex-end">
          <button id="disconnect" class="ghost">断开连接</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var base = location.origin;
        var proto = location.protocol === "https:" ? "wss" : "ws";
        var ws = null, retry = null, connected = false, keepClosed = false;
        var pwd = sessionStorage.getItem("lanshare_pwd") || "";
        var name = sessionStorage.getItem("lanshare_name") || detectName();
        // 扫码免密令牌：来自二维码 URL 的 ?t=xxx。只在内存里，刷新页面若地址栏仍在则继续有效。
        var scanToken = new URLSearchParams(location.search).get("t") || "";
        var autoMode = !!scanToken; // 扫码进入 → 免密自动连接；手动输网址 → 输入密码

        var $ = function (id) { return document.getElementById(id); };
        $("pwd").value = pwd;
        $("name").value = name;

        function detectName() {
          var ua = navigator.userAgent;
          if (/iPhone|iPad|iPod/.test(ua)) return "iPhone";
          if (/Android/.test(ua)) return "Android";
          if (/Windows/.test(ua)) return "Windows";
          if (/Mac/.test(ua)) return "Mac";
          return "我的设备";
        }

        function setStatus(on, text) {
          $("dot").className = "dot " + (on ? "on" : "off");
          $("stext").textContent = text || (on ? "已连接" : "未连接");
        }

        function showMsg(text) {
          var el = $("conn-msg");
          if (text) { el.textContent = text; el.classList.remove("hidden"); }
          else el.classList.add("hidden");
        }

        function setConnected(p) {
          connected = p;
          if (p) {
            $("connect-card").classList.add("hidden");
            $("auto-card").classList.add("hidden");
            $("main-area").classList.remove("hidden");
            setStatus(true, "已连接");
          } else {
            // 免密模式下连接失败不直接甩出密码框，先给「手动输入密码」入口
            $("main-area").classList.add("hidden");
            if (autoMode) {
              $("connect-card").classList.add("hidden");
              $("auto-card").classList.remove("hidden");
            } else {
              $("connect-card").classList.remove("hidden");
            }
            setStatus(false, "未连接");
          }
        }

        /// 退出免密模式，切回手动输入密码的界面
        function leaveAutoMode(reason) {
          autoMode = false;
          $("auto-card").classList.add("hidden");
          $("connect-card").classList.remove("hidden");
          if (reason) showMsg(reason);
        }

        function fmtSize(bytes) {
          var b = bytes || 0;
          if (b < 1024) return b + " B";
          if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
          if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
          return (b / 1073741824).toFixed(2) + " GB";
        }
        // 与主机端一致：这几种扩展名服务端能生成缩略图，其余画扩展名徽章
        var IMG_EXTS = { jpg: 1, jpeg: 1, png: 1, gif: 1, webp: 1, bmp: 1 };
        function extOf(name) {
          var i = (name || "").lastIndexOf(".");
          return i < 0 ? "" : name.slice(i + 1).toLowerCase();
        }
        function makeBadge(ext) {
          var b = document.createElement("span");
          b.className = "ext";
          b.textContent = ext ? ext.toUpperCase().slice(0, 4) : "FILE";
          return b;
        }
        // 缩略图地址与下载地址同源同鉴权：都走 pwd，不需要额外令牌
        function thumbUrl(f) {
          return base + "/api/thumb/" + f.id + "?pwd=" + encodeURIComponent(pwd) +
            "&v=" + (f.mtime || f.created || 0);
        }
        function refreshFiles() {
          if (!connected) return;
          fetch(base + "/api/files?pwd=" + encodeURIComponent(pwd))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var box = $("files");
              box.innerHTML = "";
              var fs = (d.files || []).slice().reverse();
              if (!fs.length) { box.innerHTML = '<div class="empty">暂无文件</div>'; return; }
              fs.forEach(function (f) {
                var item = document.createElement("div");
                item.className = "item";
                item.innerHTML = '<div class="thumb"></div><div class="meta"><div class="name"></div><div class="sub"></div></div><div class="acts"></div>';
                var thumb = item.querySelector(".thumb");
                var ext = (f.ext || extOf(f.name)).toLowerCase();
                if (IMG_EXTS[ext]) {
                  var img = document.createElement("img");
                  img.loading = "lazy";
                  img.decoding = "async";
                  img.alt = "";
                  img.src = thumbUrl(f);
                  // 解码失败（图片损坏 / 超大图被拦）时退化为徽章，不留破图图标
                  img.onerror = function () {
                    thumb.innerHTML = "";
                    thumb.appendChild(makeBadge(ext));
                  };
                  thumb.appendChild(img);
                } else {
                  thumb.appendChild(makeBadge(ext));
                }
                item.querySelector(".name").textContent = f.name;
                item.querySelector(".sub").textContent = f.uploader + " · " + fmtSize(f.size);
                var dl = document.createElement("button");
                dl.className = "icon-btn";
                dl.title = "下载";
                dl.setAttribute("aria-label", "下载");
                dl.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
                dl.onclick = function () {
                  var a = document.createElement("a");
                  a.href = base + "/api/download/" + f.id + "?pwd=" + encodeURIComponent(pwd);
                  a.download = f.name;
                  a.click();
                };
                item.querySelector(".acts").appendChild(dl);
                box.appendChild(item);
              });
            })
            .catch(function () {});
        }

        function send(obj) {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
        }

        function doPair() {
          if (!ws || ws.readyState !== 1) return;
          if (autoMode) {
            // 扫码免密：只发令牌，不发密码
            send({ type: "pair", token: scanToken, name: name });
            showMsg("");
            return;
          }
          pwd = $("pwd").value.trim();
          name = $("name").value.trim() || detectName();
          sessionStorage.setItem("lanshare_pwd", pwd);
          sessionStorage.setItem("lanshare_name", name);
          send({ type: "pair", password: pwd, name: name });
          showMsg("");
        }

        function connect() {
          if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
          ws = new WebSocket(proto + "://" + location.host + "/ws?role=device&name=" + encodeURIComponent(name));
          ws.onopen = function () {
            setStatus(true, "连接中…");
            if (retry) clearInterval(retry);
            doPair();
          };
          ws.onclose = function () {
            setConnected(false);
            // 扫码免密失败（令牌过期/服务重启）没必要反复重连，交给用户决定
            if (autoMode) {
              autoFailed("扫码免密已失效，请手动输入密码。");
              return;
            }
            if (keepClosed || connected) return;
            if (!retry) retry = setInterval(function () {
              if (!connected && !keepClosed) connect();
            }, 3000);
          };
          ws.onmessage = function (ev) {
            var m;
            try { m = JSON.parse(ev.data); } catch (e) { return; }
            if (m.type === "welcome") {
              if (m.role === "device") {
                setStatus(true, "连接中…");
                if (typeof m.text === "string") applyRemote(m.text);
              }
            } else if (m.type === "paired") {
              if (m.ok) {
                keepClosed = false;
                autoMode = false; // 配对成功后无需再区分来源
                // 扫码免密配对时服务端会补发连接密码：文件上传/下载走 HTTP 接口，
                // 那些接口只认密码不认令牌。不接收的话会出现「文本能同步、传文件失败」。
                if (m.password) {
                  pwd = String(m.password);
                  $("pwd").value = pwd;
                  try { sessionStorage.setItem("lanshare_pwd", pwd); } catch (e) {}
                }
                setConnected(true);
                refreshFiles();
              } else {
                if (autoMode) {
                  autoFailed(m.error || "扫码免密连接失败，请手动输入密码。");
                } else {
                  showMsg(m.error || "连接失败");
                  setStatus(false, "未连接");
                }
              }
            } else if (m.type === "disconnected") {
              setConnected(false);
              showMsg("已被主机关断");
            } else if (m.type === "text") {
              applyRemote(m.value);
            }
          };
        }

        /// 免密自动连接失败：提示并提供「手动输入密码」入口
        function autoFailed(text) {
          setStatus(false, "未连接");
          $("auto-text").textContent = "扫码免密未能连接。";
          var el = $("auto-msg");
          el.textContent = text || "扫码免密已失效，请手动输入密码。";
          el.classList.remove("hidden");
          $("auto-fallback").classList.remove("hidden");
          if (ws) { try { ws.close(); } catch (e) {} ws = null; }
        }

        $("connect").onclick = function () {
          if (ws && ws.readyState === 1) doPair();
          else connect();
        };
        $("auto-manual").onclick = function () {
          leaveAutoMode("请输入连接密码。");
          connect();
        };
        $("disconnect").onclick = function () {
          keepClosed = true;
          if (retry) { clearInterval(retry); retry = null; }
          if (ws) ws.close();
          connected = false;
          setConnected(false);
        };
        // 图标按钮触发系统文件选择器；选中后立即上传（移动端异步后 input.files 可能失效，故先缓存）
        var pickedFiles = [];
        function upMsg(t) { var el = $("up-msg"); if (el) el.textContent = t || ""; }
        $("upload").onclick = function () { $("file").click(); };
        $("file").onchange = function () {
          pickedFiles = [];
          var f = $("file").files;
          for (var i = 0; i < f.length; i++) pickedFiles.push(f[i]);
          if (pickedFiles.length) doUpload();
          else upMsg("");
        };

        function doUpload() {
          var files = pickedFiles.length ? pickedFiles : (function () {
            // 兜底：若 change 未触发，尝试读取 input.files
            var arr = [], f = $("file").files;
            for (var i = 0; i < f.length; i++) arr.push(f[i]);
            return arr;
          })();
          if (!files.length) { upMsg("请先选择要上传的文件"); return; }
          if (!pwd) { upMsg("缺少连接密码，请断开后重新连接（扫码连接会自动补齐）"); return; }
          if (!connected) { upMsg("未连接，请先连接"); return; }
          $("upload").disabled = true;
          var total = files.length, done = 0, fail = 0, firstErr = "";
          upMsg("上传中… 0/" + total);
          var finish = function () {
            if (done + fail < total) return;
            $("upload").disabled = false;
            pickClear();
            if (done && !fail) upMsg("已上传 " + done + " 个文件");
            else if (done && fail) upMsg("上传 " + done + " 个，失败 " + fail + " 个" + (firstErr ? "（" + firstErr + "）" : ""));
            else upMsg("上传失败：" + (firstErr || "请检查连接后重试"));
            refreshFiles();
          };
          files.forEach(function (file, idx) {
            var fd = new FormData();
            fd.append("file", file, file.name || ("file" + idx));
            fetch(base + "/api/upload?pwd=" + encodeURIComponent(pwd) + "&name=" + encodeURIComponent(name), { method: "POST", body: fd })
              .then(function (r) {
                if (r.ok) { done++; }
                else { fail++; if (!firstErr) firstErr = "HTTP " + r.status; }
              })
              .catch(function (e) {
                fail++; if (!firstErr) firstErr = (e && e.message) || "网络错误";
              })
              .then(function () {
                upMsg("上传中… " + (done + fail) + "/" + total);
                finish();
              });
          });
        }
        function pickClear() {
          pickedFiles = [];
          var inp = $("file");
          try { inp.value = ""; } catch (e) {}
        }
        // 共享文本框：输入即广播（防抖）；收到远端文本覆盖本地（防回环）
        var applying = false, textTimer = null;
        $("shared").addEventListener("input", function () {
          if (applying) return;
          $("hint").textContent = "编辑中…";
          if (textTimer) clearTimeout(textTimer);
          textTimer = setTimeout(function () {
            send({ type: "text", value: $("shared").value });
            $("hint").textContent = "已同步";
          }, 120);
        });
        function applyRemote(value) {
          var el = $("shared");
          if (el.value === value) return;
          applying = true;
          el.value = value;
          applying = false;
          $("hint").textContent = "已同步";
        }

        $("clear").onclick = function () {
          var el = $("shared");
          if (!el.value) return;
          if (!window.confirm("确定清空共享文本框？所有设备的内容都会被清空。")) return;
          if (textTimer) clearTimeout(textTimer);
          el.value = "";
          send({ type: "text", value: "" });
          $("hint").textContent = "已同步";
        };

        $("copy").onclick = function () {
          var v = $("shared").value;
          if (v) {
            if (navigator.clipboard) navigator.clipboard.writeText(v).catch(fallbackCopy);
            else fallbackCopy();
          }
        };
        function fallbackCopy() {
          $("shared").select();
          try { document.execCommand("copy"); } catch (e) {}
        }

        // 初始界面：扫码进来显示「正在连接」，手动进来显示密码卡片
        if (autoMode) {
          $("connect-card").classList.add("hidden");
          $("auto-card").classList.remove("hidden");
        } else {
          $("auto-card").classList.add("hidden");
        }
        connect();
        setInterval(refreshFiles, 5000);
      })();
    </script>
  </body>
</html>
