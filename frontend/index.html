<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LanShare · 控制面板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <!-- 左侧导航 -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m8 7 4-4 4 4"/></svg>
          </div>
          <div>
            <h1>LanShare</h1>
            <p>局域网互传</p>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-view="home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            <span>首页</span>
          </button>
          <button class="nav-item" data-view="devices">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            <span>传输</span>
          </button>
          <button class="nav-item" data-view="settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1A2 2 0 1 1 8.2 5.2l.1.1A1.7 1.7 0 0 0 11 4.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 11H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            <span>设置</span>
          </button>
        </nav>

        <div class="side-status">
          <span id="side-dot" class="dot"></span>
          <span id="side-text">服务状态</span>
        </div>
      </aside>

      <!-- 主区域 -->
      <main class="main">
        <!-- 首页 -->
        <section class="view active" id="view-home">
          <div class="view-head">
            <h2>首页</h2>
            <p>连接信息与快速控制</p>
          </div>

          <div class="card">
            <h3>连接信息</h3>
            <div class="row top">
              <div style="flex: 1; min-width: 240px">
                <div class="muted" style="margin-bottom: 6px">局域网地址（其他设备浏览器打开）</div>
                <div id="ip-list" class="ip-list"></div>
                <div style="margin-top: 12px" class="copy-url" id="client-url"></div>
                <div class="muted" style="margin-top: 8px">
                  用手机扫码或浏览器访问上述地址，输入连接密码即可连接。
                </div>
              </div>
              <div style="text-align: center">
                <div class="qr" id="qr-box"><span class="muted">二维码</span></div>
                <div class="muted" style="margin-top: 6px">手机扫码直达</div>
              </div>
            </div>
          </div>

          <div class="section-split">
            <div class="card">
              <h3>连接密码</h3>
              <div class="row">
                <input id="pwd-display" type="text" readonly value="······" class="pwd-strong" />
                <button class="icon-btn" id="pwd-toggle" title="显示密码" aria-label="显示密码">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="card">
              <h3>服务开关</h3>
              <div class="row between">
                <div class="row">
                  <span id="svc-dot" class="dot"></span>
                  <span id="svc-text" class="muted">检测中…</span>
                </div>
                <button id="svc-toggle" class="primary">停止服务</button>
              </div>
            </div>
          </div>

          <div class="card" id="home-devices-card">
            <h3>已连接设备</h3>
            <div id="home-devices" class="dev-chips"></div>
          </div>
        </section>

        <!-- 传输 -->
        <section class="view" id="view-devices">
          <div class="view-head">
            <h2>传输</h2>
            <p>已连接设备、文件互传与文本同步</p>
          </div>

          <div class="card">
            <h3>已连接设备</h3>
            <div id="device-list" class="dev-chips"></div>
          </div>

          <div class="tx-split">
            <!-- 左：文本同步 -->
            <div class="card">
              <h3>文本同步</h3>
              <div class="muted tx-label">多设备共享文本框，终端编辑实时互通。</div>
              <textarea id="text-shared" placeholder="在此输入，所有已连接设备实时同步…"></textarea>
              <div class="row" style="margin-top: 8px; justify-content: space-between">
                <span class="muted" id="text-hint"></span>
                <div class="row" style="gap: 6px">
                  <button class="icon-btn" id="text-clear" title="清空" aria-label="清空">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                  </button>
                  <button class="icon-btn" id="text-copy" title="复制" aria-label="复制">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 右：文件共享 -->
            <div class="card">
              <h3>文件共享</h3>

              <div class="row between" style="align-items: center">
                <div class="muted tx-label" style="margin: 0">发送文件（上传到本机，供设备下载）</div>
                <button class="icon-btn" id="share-pick" title="选择文件并上传" aria-label="选择文件并上传">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg>
                </button>
                <input id="share-file" type="file" multiple hidden />
              </div>
              <div class="muted" id="share-status" style="margin-top: 6px"></div>

              <hr class="sep" />

              <div id="file-list" class="list"></div>
            </div>
          </div>
        </section>

        <!-- 设置 -->
        <section class="view" id="view-settings">
          <div class="view-head">
            <h2>设置</h2>
            <p>常规设置</p>
          </div>

          <div class="card">
            <h3>连接密码</h3>
            <div class="muted" style="margin-bottom: 8px">6 位数字，修改后已连接设备需重新输入。</div>
            <input id="set-pwd" type="text" maxlength="6" inputmode="numeric" placeholder="6 位数字" />
            <div class="row" style="margin-top: 10px">
              <button id="set-pwd-reset" class="ghost">重置密码</button>
            </div>
          </div>

          <div class="card">
            <h3>服务端口</h3>
            <div class="muted" style="margin-bottom: 8px">修改端口后服务会自动重启。</div>
            <input id="set-port" type="number" min="1024" max="65535" />
          </div>

          <div class="card">
            <h3>接收目录</h3>
            <div class="muted" style="margin-bottom: 8px">文件落盘位置（按上传者分子目录）。</div>
            <input id="storage-input" type="text" placeholder="选择接收目录" />
            <div class="row" style="margin-top: 10px">
              <button id="storage-pick" class="ghost">选择目录</button>
              <button id="storage-open" class="ghost">打开文件夹</button>
            </div>
          </div>

          <div class="row" style="margin-top: 4px">
            <button class="primary" id="settings-save">保存设置</button>
            <span id="settings-msg" class="muted"></span>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="panel.js"></script>
  </body>
</html>
